AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CXM In-Place Query KMS Grant — grants CXM reader accounts kms:Decrypt on the KMS key
  that encrypts a log bucket, using a KMS grant. A grant is additive: it never reads or
  replaces the key policy, so the key's existing statements (e.g. Control Tower's) are
  left untouched. Deploy in the account and region that OWN THE KEY — for a Control Tower
  CloudTrail key that is the organization management account, which is a different account
  than the one holding the bucket.

  CloudFormation has no native KMS-grant resource, so a small inline Lambda custom resource
  creates the grants on stack create and revokes them on stack delete.

Parameters:
  KmsKeyArn:
    Type: String
    Description: ARN of the KMS key encrypting the log bucket
    AllowedPattern: '^arn:aws:kms:[a-z0-9-]+:\d{12}:key/(mrk-)?[a-f0-9-]+$'
    ConstraintDescription: Must be a valid KMS key ARN
  CXMCustomerAccountId:
    Type: String
    Description: 12-digit CXM AWS account ID that queries the bucket in place
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID
  AdditionalCXMCustomerAccountId:
    Type: String
    Default: ''
    Description: Optional — a second CXM account that also queries the bucket (e.g. staging alongside production)
    AllowedPattern: '^(\d{12})?$'
    ConstraintDescription: Must be a 12-digit AWS account ID or empty

Conditions:
  hasAdditionalReader: !Not [!Equals [!Ref AdditionalCXMCustomerAccountId, '']]

Resources:
  KmsGrantFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kms-inplace-grant
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Grant management is scoped to the one key this stack targets.
              - Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:RevokeGrant
                  - kms:ListGrants
                Resource: !Ref KmsKeyArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  KmsGrantFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Manages CXM in-place-query KMS grants for the stack lifecycle
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt KmsGrantFunctionRole.Arn
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          kms = boto3.client("kms")
          PREFIX = "cxm-inplace-decrypt"

          # Self-contained CFN response (the cfnresponse module is not present in the runtime).
          def _respond(event, context, status, physical_id, data=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": f"See CloudWatch log stream {context.log_stream_name}",
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {},
              }).encode()
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))},
              )
              urllib.request.urlopen(req)

          def _managed_grants(key_id, accounts):
              # Grants this stack owns, keyed by name (only for the accounts it manages).
              names = {f"{PREFIX}-{a}" for a in accounts}
              found, marker = {}, None
              while True:
                  kw = {"KeyId": key_id, "Limit": 100}
                  if marker:
                      kw["Marker"] = marker
                  resp = kms.list_grants(**kw)
                  for g in resp.get("Grants", []):
                      if g.get("Name") in names:
                          found[g["Name"]] = g["GrantId"]
                  if resp.get("Truncated"):
                      marker = resp["NextMarker"]
                  else:
                      break
              return found

          def handler(event, context):
              rt = event["RequestType"]
              props = event.get("ResourceProperties", {})
              key_id = props.get("KmsKeyArn", "")
              accounts = [a for a in props.get("GranteeAccountIds", []) if a]
              pid = event.get("PhysicalResourceId") or f"{PREFIX}@{key_id}"
              try:
                  have = _managed_grants(key_id, accounts)
                  if rt in ("Create", "Update"):
                      for a in accounts:
                          name = f"{PREFIX}-{a}"
                          if name not in have:  # create_grant is not idempotent; skip if present
                              kms.create_grant(
                                  KeyId=key_id,
                                  GranteePrincipal=f"arn:aws:iam::{a}:root",
                                  Operations=["Decrypt", "DescribeKey"],
                                  Name=name,
                              )
                  elif rt == "Delete":
                      for gid in have.values():
                          kms.revoke_grant(KeyId=key_id, GrantId=gid)
                  _respond(event, context, "SUCCESS", pid)
              except Exception as e:
                  _respond(event, context, "FAILED", pid, {"Error": str(e)})

  # On Update, GranteeAccountIds is re-read and reconciled; on Delete, all managed grants are revoked.
  CxmInPlaceKmsGrant:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt KmsGrantFunction.Arn
      KmsKeyArn: !Ref KmsKeyArn
      GranteeAccountIds: !If
        - hasAdditionalReader
        - [!Ref CXMCustomerAccountId, !Ref AdditionalCXMCustomerAccountId]
        - [!Ref CXMCustomerAccountId]

Outputs:
  KmsKeyArn:
    Description: Key the in-place decrypt grant applies to
    Value: !Ref KmsKeyArn
  GranteeAccounts:
    Description: CXM accounts granted Decrypt on the key
    Value: !If
      - hasAdditionalReader
      - !Sub '${CXMCustomerAccountId}, ${AdditionalCXMCustomerAccountId}'
      - !Ref CXMCustomerAccountId
