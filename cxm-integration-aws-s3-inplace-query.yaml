AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CXM In-Place Query Access — grants CXM the S3 resource-policy permissions needed to
  query a log bucket in place with Athena. Deploy once per bucket, in the account and
  region that owns the bucket. Typical targets: the centralized CloudTrail bucket and the
  centralized VPC Flow Logs bucket.

  DEFAULT MODE IS OUTPUT-ONLY: the stack renders the statements to merge into your
  existing bucket policy. Set ManageBucketPolicy to "true" only for a bucket dedicated to
  this integration — it REPLACES the whole bucket policy.

  KMS: if the bucket is encrypted, set InPlaceQueryKmsKeyArn on the root stack
  (cxm-integration-aws-root.yaml) — it creates a KMS grant, which leaves the existing key
  policy untouched.

# Athena reads S3 as the query submitter, not the reader role, so only a resource policy
# works. Output-only by default: AWS::S3::BucketPolicy would replace log-delivery statements.

Parameters:
  CXMCustomerAccountId:
    Type: String
    Description: 12-digit CXM AWS account ID provided by CXM (the account allowed to query the bucket)
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID
  BucketName:
    Type: String
    Description: Name of the log bucket to grant in-place query access to (bucket name only, not the ARN)
    AllowedPattern: '^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$'
    ConstraintDescription: "Must be an S3 bucket name (not an ARN). Example: my-cloudtrail-bucket"
  ObjectPrefix:
    Type: String
    Default: AWSLogs
    Description: >-
      Object key prefix the grant is narrowed to. A trailing "/" is added automatically,
      so pass "AWSLogs", not "AWSLogs/". CloudTrail and VPC Flow Logs both write under
      "AWSLogs" by default.
    AllowedPattern: '^[^/]$|^[^/].*[^/]$'
    ConstraintDescription: Must not be empty and must not start or end with a "/"
  AdditionalCXMCustomerAccountId:
    Type: String
    Default: ''
    Description: >-
      Optional — a second CXM account that also queries this bucket (for example a staging
      environment alongside production). Adds its own statement set, Sid-suffixed with the
      account id. More than two readers needs the Terraform module, which takes a list.
    AllowedPattern: '^(\d{12})?$'
    ConstraintDescription: Must be a 12-digit AWS account ID or empty
  ManageBucketPolicy:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      DANGEROUS on a shared log bucket. "true" makes this stack own the bucket policy,
      REPLACING whatever policy is currently attached — including the AWS log-delivery
      statements CloudTrail and VPC Flow Logs need to keep writing. Only set it for a
      bucket dedicated to this integration with no policy of its own. Leave "false" to
      take the statements from the outputs and merge them yourself.

Conditions:
  ManageBucketPolicyEnabled: !Equals [!Ref ManageBucketPolicy, "true"]
  hasAdditionalReader: !Not [!Equals [!Ref AdditionalCXMCustomerAccountId, '']]

Resources:
  # Keep the three statements split: GetBucketLocation rejects the s3:prefix condition key.
  # No aws:CalledVia — Athena does not set it on scans, so the condition would deny Athena.
  CxmInPlaceQueryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ManageBucketPolicyEnabled
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Account id in every Sid: S3 accepts duplicates, but then one reader's grant
          # cannot be revoked without rewriting the other's.
          - Sid: !Sub "CxMInPlaceGetObject${CXMCustomerAccountId}"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CXMCustomerAccountId}:root"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/${ObjectPrefix}/*"
          - Sid: !Sub "CxMInPlaceListBucket${CXMCustomerAccountId}"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CXMCustomerAccountId}:root"
            Action: s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${BucketName}"
            Condition:
              StringLike:
                s3:prefix: !Sub "${ObjectPrefix}/*"
          - Sid: !Sub "CxMInPlaceGetBucketLocation${CXMCustomerAccountId}"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CXMCustomerAccountId}:root"
            Action: s3:GetBucketLocation
            Resource: !Sub "arn:aws:s3:::${BucketName}"
          # One Fn::If per statement: CloudFormation does not flatten a list into a list.
          - "Fn::If":
            - hasAdditionalReader
            - Sid: !Sub "CxMInPlaceGetObject${AdditionalCXMCustomerAccountId}"
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${BucketName}/${ObjectPrefix}/*"
            - !Ref AWS::NoValue
          - "Fn::If":
            - hasAdditionalReader
            - Sid: !Sub "CxMInPlaceListBucket${AdditionalCXMCustomerAccountId}"
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"
              Action: s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${BucketName}"
              Condition:
                StringLike:
                  s3:prefix: !Sub "${ObjectPrefix}/*"
            - !Ref AWS::NoValue
          - "Fn::If":
            - hasAdditionalReader
            - Sid: !Sub "CxMInPlaceGetBucketLocation${AdditionalCXMCustomerAccountId}"
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"
              Action: s3:GetBucketLocation
              Resource: !Sub "arn:aws:s3:::${BucketName}"
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Description: Bucket the in-place query grant applies to
    Value: !Ref BucketName
  ObjectPrefix:
    Description: Object key prefix the grant is narrowed to
    Value: !Sub "${ObjectPrefix}/"
  BucketPolicyManaged:
    Description: Whether this stack owns the bucket policy
    Value: !If
      - ManageBucketPolicyEnabled
      - "YES — this stack owns the bucket policy"
      - "NO — merge BucketPolicyStatementsJson into the bucket policy yourself"

  BucketPolicyStatementsJson:
    Description: >-
      Bucket policy statements granting CXM in-place query access. Merge these into the
      bucket's existing policy when ManageBucketPolicy is "false". Every Sid carries the
      reader's account id, so a second CXM environment's statements merge alongside these
      instead of colliding.
    Value: !If
      - hasAdditionalReader
      - !Sub '[{"Sid":"CxMInPlaceGetObject${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::${BucketName}/${ObjectPrefix}/*"},{"Sid":"CxMInPlaceListBucket${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:ListBucket","Resource":"arn:aws:s3:::${BucketName}","Condition":{"StringLike":{"s3:prefix":"${ObjectPrefix}/*"}}},{"Sid":"CxMInPlaceGetBucketLocation${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:GetBucketLocation","Resource":"arn:aws:s3:::${BucketName}"},{"Sid":"CxMInPlaceGetObject${AdditionalCXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::${BucketName}/${ObjectPrefix}/*"},{"Sid":"CxMInPlaceListBucket${AdditionalCXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"},"Action":"s3:ListBucket","Resource":"arn:aws:s3:::${BucketName}","Condition":{"StringLike":{"s3:prefix":"${ObjectPrefix}/*"}}},{"Sid":"CxMInPlaceGetBucketLocation${AdditionalCXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"},"Action":"s3:GetBucketLocation","Resource":"arn:aws:s3:::${BucketName}"}]'
      - !Sub '[{"Sid":"CxMInPlaceGetObject${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::${BucketName}/${ObjectPrefix}/*"},{"Sid":"CxMInPlaceListBucket${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:ListBucket","Resource":"arn:aws:s3:::${BucketName}","Condition":{"StringLike":{"s3:prefix":"${ObjectPrefix}/*"}}},{"Sid":"CxMInPlaceGetBucketLocation${CXMCustomerAccountId}","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::${CXMCustomerAccountId}:root"},"Action":"s3:GetBucketLocation","Resource":"arn:aws:s3:::${BucketName}"}]'
