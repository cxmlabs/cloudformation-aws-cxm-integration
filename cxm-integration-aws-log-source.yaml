AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CXM Integration - Log Source Reader.
  Deploy this stack in the account and region where a centralized log bucket is located.
  One stack per bucket: LogSource names the role after the log type, so a VPC Flow Logs
  bucket and a CloudTrail bucket in the same account get distinct, self-describing roles.
  This may be a different account and region from the management account.

# One stack per bucket: the role's grant and the EventBridge rule each name a single bucket.

Parameters:
  # CXM Accounts
  CXMExternalId:
    Type: String
    Description: External ID created for this deployment
  CXMCustomerAccountId:
    Type: String
    Description: Account ID of the instance set up for this deployment
  AdditionalCXMCustomerAccountId:
    Type: String
    Default: ''
    Description: >-
      Optional - a second CXM account that also reads this bucket (for example a staging
      environment alongside production). Adds a trust statement on the reader role and a
      second in-place statement set. More than two readers needs the Terraform module.
    AllowedPattern: '^(\d{12})?$'
    ConstraintDescription: Must be a 12-digit AWS account ID or empty
  AdditionalCXMExternalId:
    Type: String
    Default: ''
    Description: Optional - external ID of the second CXM account. Required when AdditionalCXMCustomerAccountId is set; external IDs are per CXM environment.
  # Log source
  LogSource:
    Type: String
    Default: flowlogs
    AllowedValues: ['flowlogs', 'cloudtrail']
    Description: >-
      Type of log stored in this bucket. Names every resource the stack creates, so the reader
      role reads "<Prefix>-flowlogs-reader" or "<Prefix>-cloudtrail-reader" — CXM is configured
      with that exact role name per log source.
  LogSourceBucketName:
    Type: String
    Description: Name of the S3 bucket storing the centralized logs (bucket name only, not the ARN)
    AllowedPattern: '^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$'
    ConstraintDescription: "Must be an S3 bucket name (not an ARN). Example: my-flowlogs-bucket"
  LogSourceBucketKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional - ARN of the KMS key used to encrypt the logs in S3.
  # In-place query access
  EnableInPlaceQueryGrant:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Set to true to render the bucket and KMS key policy statements CXM needs to query the bucket in place. Rendering changes nothing in your account — the statements appear as stack outputs for you to merge into the bucket's existing policy yourself.
  InPlaceQueryObjectPrefix:
    Type: String
    Default: AWSLogs
    Description: Object key prefix the in-place query grant is narrowed to, without a trailing slash.
    AllowedPattern: '^[A-Za-z0-9!_.*''()\-]+(/[A-Za-z0-9!_.*''()\-]+)*$'
    ConstraintDescription: Must be an S3 key prefix with no leading or trailing slash (e.g. AWSLogs)
  # Prefix / Suffix
  Prefix:
    Type: String
    Default: cxm
    Description: Generic ID to namespace the stacks
  RoleSuffix:
    Type: String
    Default: ""
    Description: Role name suffix

# Without the external ID the trust renders StringEquals on "" — present, satisfiable by nobody.
Rules:
  AdditionalReaderNeedsExternalId:
    RuleCondition: !Not [ !Equals [ !Ref AdditionalCXMCustomerAccountId, '' ] ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref AdditionalCXMExternalId, '' ] ]
        AssertDescription: AdditionalCXMExternalId is required when AdditionalCXMCustomerAccountId is set.

Conditions:
  isKmsKeyArnSet: !Not [ !Equals [ !Ref LogSourceBucketKmsKeyArn, '' ] ]
  hasAdditionalReader: !Not [ !Equals [ !Ref AdditionalCXMCustomerAccountId, '' ] ]
  isInPlaceQueryGrantEnabled: !Equals [ !Ref EnableInPlaceQueryGrant, 'true' ]
  isInPlaceQueryKmsGrantNeeded: !And [ !Condition isInPlaceQueryGrantEnabled, !Condition isKmsKeyArnSet ]

Resources:

  ################################################################
  #
  # Log Source Reader
  #
  # CxmFlowLogs* logical ids are frozen: renaming one makes CloudFormation create the
  # replacement before deleting the original, and both carry the same explicit RoleName.
  #
  ################################################################
  CxmFlowLogsReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Prefix}-${LogSource}-reader${RoleSuffix}'
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Principal:
              AWS: !Sub "arn:aws:iam::${CXMCustomerAccountId}:root"
            Condition:
              StringEquals:
                sts:ExternalId: !Sub '${CXMExternalId}'
          # A statement per reader: StringEquals with two external IDs is an OR.
          - "Fn::If":
            - hasAdditionalReader
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Principal:
                AWS: !Sub "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root"
              Condition:
                StringEquals:
                  sts:ExternalId: !Sub '${AdditionalCXMExternalId}'
            - !Ref AWS::NoValue

  CxmFlowLogsReaderPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Prefix}-${LogSource}-reader${RoleSuffix}-policy'
      Roles:
        - !Ref 'CxmFlowLogsReaderRole'
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:ListBucket"
            Resource: !Sub "arn:aws:s3:::${LogSourceBucketName}"
          - Effect: Allow
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${LogSourceBucketName}/*"
          # No kms:EncryptionContext: S3 sets it to the object ARN, so a bucket-ARN test
          # never matches. Resource already pins the one key.
          - "Fn::If":
            - isKmsKeyArnSet
            - Effect: Allow
              Action:
                - "kms:Decrypt"
                - "kms:DescribeKey"
              Resource: !Ref LogSourceBucketKmsKeyArn
            - !Ref AWS::NoValue

  ################################################################
  #
  # Notifications
  #
  ################################################################
  CxmFlowLogsNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${LogSource}-notification${RoleSuffix}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "sts:AssumeRole"
            Principal:
              Service: "events.amazonaws.com"

  CxmFlowLogsNotificationRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${Prefix}-${LogSource}-notification${RoleSuffix}-policy"
      Roles:
        - !Ref CxmFlowLogsNotificationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "events:PutEvents"
            Resource:
              - !Sub "arn:aws:events:*:${CXMCustomerAccountId}:event-bus/data-plane*"

  # Needs EventBridge notifications on the bucket, or this rule never fires:
  # aws s3api put-bucket-notification-configuration --notification-configuration '{"EventBridgeConfiguration":{}}'
  CxmFlowLogsBucketEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-${LogSource}-bucket-change-notifier${RoleSuffix}"
      Description: !Sub "Notifies when changes happen to files in the ${LogSource} S3 bucket"
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "Object Created"
          - "Object Deleted"
        detail:
          bucket:
            name:
              - !Ref LogSourceBucketName
      Targets:
        - Id: "SendToDataPlaneBus"
          Arn: !Sub "arn:aws:events:${AWS::Region}:${CXMCustomerAccountId}:event-bus/data-plane"
          RoleArn: !GetAtt CxmFlowLogsNotificationRole.Arn

################################################################
#
# Outputs
#
################################################################
Outputs:
  # Echoing inputs for debug
  Prefix:
    Description: Generic ID to namespace the stacks
    Value: !Ref Prefix
  RoleSuffix:
    Description: Role name suffix
    Value: !Ref RoleSuffix
  LogSource:
    Description: Type of log stored in this bucket
    Value: !Ref LogSource
  LogSourceBucketName:
    Description: Name of the S3 bucket storing the logs
    Value: !Ref LogSourceBucketName

  # Rendered, not applied: CloudFormation cannot read the existing bucket policy to merge into.
  InPlaceQueryBucketPolicyStatements:
    Condition: isInPlaceQueryGrantEnabled
    Description: Bucket policy statements to merge into the bucket's existing policy so CXM can query it in place. Keep the statements separate, and keep the account id in each Sid — S3 accepts duplicate Sids but nothing can tell such statements apart afterwards, so the suffix is what lets a second reader's statements merge alongside these and be revoked independently.
    Value: !If
      - hasAdditionalReader
      - !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
          {
            "Sid": "CxMInPlaceGetObject${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:GetObject",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}/${InPlaceQueryObjectPrefix}/*"
          },
          {
            "Sid": "CxMInPlaceListBucket${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:ListBucket",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}",
            "Condition": { "StringLike": { "s3:prefix": "${InPlaceQueryObjectPrefix}/*" } }
          },
          {
            "Sid": "CxMInPlaceGetBucketLocation${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:GetBucketLocation",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}"
          },
          {
            "Sid": "CxMInPlaceGetObject${AdditionalCXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root" },
            "Action": "s3:GetObject",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}/${InPlaceQueryObjectPrefix}/*"
          },
          {
            "Sid": "CxMInPlaceListBucket${AdditionalCXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root" },
            "Action": "s3:ListBucket",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}",
            "Condition": { "StringLike": { "s3:prefix": "${InPlaceQueryObjectPrefix}/*" } }
          },
          {
            "Sid": "CxMInPlaceGetBucketLocation${AdditionalCXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root" },
            "Action": "s3:GetBucketLocation",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}"
          }
          ]
        }
      - !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
          {
            "Sid": "CxMInPlaceGetObject${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:GetObject",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}/${InPlaceQueryObjectPrefix}/*"
          },
          {
            "Sid": "CxMInPlaceListBucket${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:ListBucket",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}",
            "Condition": { "StringLike": { "s3:prefix": "${InPlaceQueryObjectPrefix}/*" } }
          },
          {
            "Sid": "CxMInPlaceGetBucketLocation${CXMCustomerAccountId}",
            "Effect": "Allow",
            "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
            "Action": "s3:GetBucketLocation",
            "Resource": "arn:aws:s3:::${LogSourceBucketName}"
          }
          ]
        }
  InPlaceQueryKmsKeyPolicyStatement:
    Condition: isInPlaceQueryKmsGrantNeeded
    Description: KMS key policy statements to merge into the encryption key's existing policy, one per reader. Merge them — replacing a key policy without its administrative statements locks the key permanently.
    Value: !If
      - hasAdditionalReader
      - !Sub |
        [
        {
          "Sid": "CxMInPlaceDecrypt${CXMCustomerAccountId}",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
          "Action": ["kms:Decrypt", "kms:DescribeKey"],
          "Resource": "*"
        },
        {
          "Sid": "CxMInPlaceDecrypt${AdditionalCXMCustomerAccountId}",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::${AdditionalCXMCustomerAccountId}:root" },
          "Action": ["kms:Decrypt", "kms:DescribeKey"],
          "Resource": "*"
        }
        ]
      - !Sub |
        [
        {
          "Sid": "CxMInPlaceDecrypt${CXMCustomerAccountId}",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::${CXMCustomerAccountId}:root" },
          "Action": ["kms:Decrypt", "kms:DescribeKey"],
          "Resource": "*"
        }
        ]

  # Log Source Reader
  CxmLogSourceReaderRoleArn:
    Description: ARN of the Log Source Reader IAM Role
    Value: !GetAtt CxmFlowLogsReaderRole.Arn
  CxmLogSourceReaderRoleId:
    Description: Id of the Log Source Reader IAM Role
    Value: !GetAtt CxmFlowLogsReaderRole.RoleId
