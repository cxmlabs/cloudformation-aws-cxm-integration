AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  # CXM Accounts
  CXMExternalId:
    Type: String
    Description: External ID provided by CXM for this deployment
  CXMCustomerAccountId:
    Type: String
    Description: 12-digit CXM AWS account ID provided by CXM (used to authorize cross-account access)
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID
  # Accounts
  ManagementAccountId:
    Type: String
    Description: Your 12-digit AWS Organizations management account ID
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID
  # Regions
  ManagementRegion:
    Type: String
    Default: "us-east-1"
    Description: >-
      Single region in which the (global) IAM roles are created. IAM roles are
      global, so in a multi-region StackSet they must be created in exactly one
      region to avoid "already exists" collisions; EventBridge rules deploy to
      every region regardless.
  # Prefix
  Prefix:
    Type: String
    Default: cxm
    Description: Generic ID to namespace the stacks
  OrganizationId:
    Type: String
    Default: ""
    Description: >-
      Optional — your AWS Organizations root ID (o-xxxxxxxxxx). When set, the management
      account's organization crawler can only assume the asset crawler role from inside
      this organization (aws:PrincipalOrgID), so a typo'd account ID cannot be trusted.
    AllowedPattern: '^(o-[a-z0-9]{10,32})?$'
    ConstraintDescription: Must be an AWS Organizations root ID (o-xxxxxxxxxx) or empty
  # Feature toggles
  EnableScheduling:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable scheduling and scaling permissions for FinOps cost optimization (disabled by default)
  EnableSavingsModifications:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable Savings Plan / Reserved Instance modifications (purchase, modify, cancel).
      Set to "false" for a read-only proof of concept — CXM then reports on commitments
      but cannot act on them. Defaults to "true" to preserve existing behaviour.

Conditions:
  SchedulingEnabled: !Equals [!Ref EnableScheduling, "true"]
  SavingsModificationsEnabled: !Equals [!Ref EnableSavingsModifications, "true"]
  isOrganizationIdSet: !Not [!Equals [!Ref OrganizationId, ""]]
  isManagementRegion: !Equals [!Ref AWS::Region, !Ref ManagementRegion]
  isSchedulingAndManagementRegion: !And [Condition: SchedulingEnabled, Condition: isManagementRegion]
  isSavingsModificationsAndManagementRegion: !And [Condition: SavingsModificationsEnabled, Condition: isManagementRegion]

Resources:

  ################################################################
  #
  # Asset Crawler
  #
  ################################################################
  CxmAssetCrawlerRole:
    Type: AWS::IAM::Role
    Condition: isManagementRegion  # Only one role per account (IAM is global)
    DependsOn: CloudFormationNotifier
    Properties:
      RoleName: !Sub '${Prefix}-asset-crawler'
      ManagedPolicyArns: !If
        - SavingsModificationsEnabled
        - - "arn:aws:iam::aws:policy/ReadOnlyAccess"
          - "arn:aws:iam::aws:policy/ServiceQuotasFullAccess"
          - "arn:aws:iam::aws:policy/AWSSavingsPlansFullAccess"
        - - "arn:aws:iam::aws:policy/ReadOnlyAccess"
          - "arn:aws:iam::aws:policy/ServiceQuotasReadOnlyAccess"
          - "arn:aws:iam::aws:policy/AWSSavingsPlansReadOnlyAccess"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - ecs-tasks.amazonaws.com
                - codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Sub '${CXMExternalId}'
          - Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Principal:
              AWS: !Sub "arn:aws:iam::${ManagementAccountId}:role/${Prefix}-organization-crawler"
            # aws:PrincipalOrgID, NOT sts:PrincipalOrgID — the latter is not a valid IAM
            # condition key, so it would never match and no account could be assumed into.
            Condition: !If
              - isOrganizationIdSet
              - StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
              - !Ref AWS::NoValue

  InventoryPolicy:
    Type: AWS::IAM::Policy
    Condition: isManagementRegion  # Only one per account (attaches to the global role)
    Properties:
      PolicyName: !Sub '${Prefix}-asset-crawler-readonly'
      Roles:
        - !Ref 'CxmAssetCrawlerRole'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CommitmentMonitoringPermissions
            Effect: Allow
            Resource: "*"
            Action:
              # DynamoDB Reservations
              - dynamodb:DescribeReservedCapacity
              - dynamodb:DescribeReservedCapacityOfferings
              # EC2 Reservations
              - ec2:DescribeReserved*
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeAccountAttributes
              - ec2:DescribeRegions
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
              - ec2:DescribeTags
              - ec2:GetReserved*
              # RDS Reservations
              - rds:DescribeReserved*
              - rds:ListTagsForResource*
              # Redshift Reservations
              - redshift:DescribeReserved*
              - redshift:DescribeTags
              - redshift:GetReserved*
              # ElastiCache Reservations
              - elasticache:DescribeReserved*
              - elasticache:ListTagsForResource
              # ElasticSearch Reservations
              - es:DescribeReserved*
              - es:ListTags
              # memoryDB
              - memorydb:DescribeReserved*
              - memorydb:ListTags
              # Savings Plans read access comes from the AWSSavingsPlansReadOnlyAccess /
              # AWSSavingsPlansFullAccess managed policy attached above.
          - Sid: BedrockInventoryPermissions
            Effect: Allow
            Resource: "*"
            Action:
              - bedrock:List*
              - bedrock:Get*
          # Explicitly denying data plane API Calls
          - Sid: ExplicitDenyToDataPlane
            Effect: Deny
            Resource: "*"
            Action:
              - athena:StartCalculationExecution
              - athena:StartQueryExecution
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - ec2:GetConsoleOutput
              - ec2:GetConsoleScreenshot
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - ecs:RegisterTaskDefinition
              - kinesis:GetRecords
              - kinesis:GetShardIterator
              - logs:GetLogEvents
              - sdb:Select*
              - sqs:ReceiveMessage
              - rds-data:*
          # ReadOnlyAccess grants s3:GetObject; CXM never reads object bodies through this
          # role. Deny on the object ARN pattern — pairing Deny with NotResource would
          # match every object in every other bucket instead.
          - Sid: ExplicitDenyOnS3Files
            Effect: Deny
            Action:
              - s3:GetObject
            Resource:
              - "arn:aws:s3:::*/*"

  ################################################################
  #
  # Savings Plan / RI modifications
  # Only created when EnableSavingsModifications is "true"
  #
  ################################################################
  InventorySavingsModificationsPolicy:
    Type: AWS::IAM::Policy
    Condition: isSavingsModificationsAndManagementRegion  # Only one per account (attaches to the global role)
    Properties:
      PolicyName: !Sub '${Prefix}-asset-crawler-savings-modifications'
      Roles:
        - !Ref 'CxmAssetCrawlerRole'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CommitmentManagementPermissions
            Effect: Allow
            Resource: "*"
            Action:
              # DynamoDB Reservations
              - dynamodb:PurchaseReservedCapacityOfferings
              # EC2 Reservations
              - ec2:ModifyReservedInstances
              - ec2:PurchaseReservedInstancesOffering
              - ec2:CreateReservedInstancesListing
              - ec2:CancelReservedInstancesListing
              - ec2:GetReservedInstancesExchangeQuote
              - ec2:AcceptReservedInstancesExchangeQuote
              # RDS Reservations
              - rds:PurchaseReservedDBInstancesOffering
              # Redshift Reservations
              - redshift:AcceptReservedNodeExchange
              - redshift:PurchaseReservedNodeOffering
              # ElastiCache Reservations
              - elasticache:PurchaseReservedCacheNodesOffering
              # ElasticSearch Reservations
              - es:PurchaseReservedElasticsearchInstanceOffering
              - es:PurchaseReservedInstanceOffering
              # memoryDB
              - memorydb:PurchaseReservedNodesOffering
              # Savings Plans management comes from the AWSSavingsPlansFullAccess managed
              # policy attached above.

  ################################################################
  #
  # Scheduling & Scaling (FinOps cost optimization)
  # Only created when EnableScheduling is "true"
  #
  ################################################################
  SchedulingPolicy:
    Type: AWS::IAM::Policy
    Condition: isSchedulingAndManagementRegion  # Only one per account (attaches to the global role)
    Properties:
      PolicyName: !Sub '${Prefix}-asset-crawler-scheduling'
      Roles:
        - !Ref 'CxmAssetCrawlerRole'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SchedulingPermissions
            Effect: Allow
            Resource: "*"
            Action:
              # ECS Scaling
              - ecs:UpdateService
              # EC2 Stop/Start
              - ec2:StartInstances
              - ec2:StopInstances
              # RDS Stop/Start
              - rds:StartDBInstance
              - rds:StopDBInstance
              - rds:StartDBCluster
              - rds:StopDBCluster
              # Lambda Concurrency
              - lambda:PutProvisionedConcurrencyConfig
              - lambda:DeleteProvisionedConcurrencyConfig
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              # EKS Nodegroup Scaling
              - eks:UpdateNodegroupConfig
              # ASG Scaling
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              # Application Auto Scaling (NOTE: covers all App Auto Scaling
              # namespaces — ECS, DynamoDB, AppStream, etc. — AWS does not
              # offer namespace-scoped IAM actions for this service)
              - application-autoscaling:RegisterScalableTarget
              # ElastiCache Scaling (NOTE: these actions are broader than scaling
              # alone — they also allow changing engine versions, parameter groups,
              # etc. — but AWS does not offer finer-grained actions)
              - elasticache:ModifyReplicationGroup
              - elasticache:ModifyCacheCluster
              # Redshift Scaling (NOTE: ResizeCluster also allows changing node
              # types, not just counts, which could affect costs)
              - redshift:PauseCluster
              - redshift:ResumeCluster
              - redshift:ResizeCluster
              # SageMaker Scaling
              - sagemaker:UpdateEndpointWeightsAndCapacities

  ################################################################
  #
  # Notifications for Feedback Loop
  #
  ################################################################
  IAMCrossAccountNotificationRole:
    Type: AWS::IAM::Role
    Condition: isManagementRegion  # Only one role per account (IAM is global)
    Properties:
      RoleName: !Sub '${Prefix}-feedback-loop-control-plane'
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cross-account-event-forwarder
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "events:PutEvents"
                Resource: !Sub "arn:aws:events:*:${CXMCustomerAccountId}:event-bus/control-plane"

  CloudFormationNotifier:
    Type: AWS::Events::Rule
    Properties:
      Description: Notifies when one of our CloudFormation Stack changes state
      EventPattern:
        resources:
          - wildcard: !Sub "*${Prefix}*"
        source:
          - aws.cloudformation
        detail-type:
          - "CloudFormation Stack Status Change"
          - "CloudFormation StackSet StackInstance Status Change"
        detail:
          status-details:
            status: [
              "CREATE_COMPLETE",
              "CREATE_FAILED",
              "DELETE_COMPLETE",
              "DELETE_FAILED",
              "ROLLBACK_COMPLETE",
              "ROLLBACK_FAILED",
              "UPDATE_COMPLETE",
              "UPDATE_FAILED",
              "UPDATE_ROLLBACK_COMPLETE",
              "UPDATE_ROLLBACK_FAILED"
            ]
      State: "ENABLED"
      Targets:
        - Id: CloudFormationNotifier
          Arn: !Sub "arn:aws:events:${AWS::Region}:${CXMCustomerAccountId}:event-bus/control-plane"
          RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Prefix}-feedback-loop-control-plane"

Outputs:
  # Diagnostic
  Prefix:
    Description: Namespace prefix used for resource names
    Value: !Ref Prefix
  ManagementAccountId:
    Description: AWS Organizations management account ID
    Value: !Ref ManagementAccountId
  DeployedAccountId:
    Description: Actual AWS account ID where this stack is running
    Value: !Ref AWS::AccountId
  DeployedRegion:
    Description: Actual AWS region where this stack is running
    Value: !Ref AWS::Region

  # Asset crawler (created only in the management region — see isManagementRegion)
  CxmAssetCrawlerRoleArn:
    Condition: isManagementRegion
    Description: ARN of the Asset Crawler IAM Role
    Value: !GetAtt CxmAssetCrawlerRole.Arn
  CxmAssetCrawlerRoleId:
    Condition: isManagementRegion
    Description: Id of the Asset Crawler IAM Role
    Value: !GetAtt CxmAssetCrawlerRole.RoleId

  # Verification
  CXMCustomerAccountId:
    Description: CXM account ID trusted in role assume policies
    Value: !Ref CXMCustomerAccountId
